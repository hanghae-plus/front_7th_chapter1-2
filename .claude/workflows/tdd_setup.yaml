# TDD Setup Workflow v3.0 - With Skeleton Code
# ============================================================================
# Philosophy: Create failing tests AND minimal skeleton to make them fail properly
# ============================================================================

name: tdd-setup
version: '3.0-LEAN'
description: BMad Method TDD setup with test and skeleton code generation
philosophy: 'Document-driven development with proper RED phase setup'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Context Requirements (What orchestrator needs to start)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
context:
  required:
    - featureId: string # F-XXX format
    - description: string # What to build

  optional:
    - complexity_hint: enum[simple, standard, complex]
    - priority: enum[p0, p1, p2, p3]
    - deadline: date

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Phases (What needs to happen in what order)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
phases:
  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 1: ANALYST - Problem Definition
  # ──────────────────────────────────────────────────────────────────────────
  analyst:
    agent: analyst

    tasks:
      - id: problem_analysis
        prompt: |
          Analyze: {{description}}
          Feature: {{featureId}}
          Create problem statement with E5 framework
        output: 01_problem.md

      - id: success_criteria
        prompt: |
          Define SMART success criteria
          Based on: 01_problem.md
        output: 02_success.md

      - id: impact_assessment
        prompt: |
          Assess 6-domain impact
        output: 03_impact.md
        skip_if: route.simple

      - id: analyst_summary
        prompt: |
          Create handoff report for PM
        output: 04_analyst_report.md

    gates:
      - check: file_exists(01_problem.md)
      - check: file_exists(02_success.md)
      - check: contains(01_problem.md, "Problem Statement")
      - check: contains(02_success.md, "SMART")

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 2: PM - Product Requirements
  # ──────────────────────────────────────────────────────────────────────────
  pm:
    agent: pm
    inputs: [analyst.outputs]

    tasks:
      - id: product_goals
        prompt: |
          Define OKRs and KPIs
          Based on: 04_analyst_report.md
        output: 05_pm_goals.md

      - id: acceptance_criteria
        prompt: |
          Create Given-When-Then scenarios
        output: 06_pm_acceptance.md

      # - id: pm_summary
      #   prompt: |
      #     Handoff package for Architect
      #   output: 07_pm_report.md

    gates:
      - check: file_exists(06_pm_acceptance.md)
      - check: contains(06_pm_acceptance.md, "Given")
      - check: contains(06_pm_acceptance.md, "Then")

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 3: ARCHITECT - Technical Design
  # ──────────────────────────────────────────────────────────────────────────
  architect:
    agent: architect
    inputs: [pm.outputs]

    tasks:
      - id: system_design
        prompt: |
          Create system architecture
          Focus on: {{description}}
        output: 08_architect_design.md
        skip_if: route.simple

      - id: api_contracts
        prompt: |
          Define API interfaces and data models
        output: 09_architect_api.md

      - id: implementation_plan
        prompt: |
          Step-by-step implementation roadmap
        output: 10_architect_plan.md

      # NEW: Create skeleton code structure
      - id: create_skeleton
        prompt: |
          Create minimal skeleton code that:
          1. Defines the interfaces from API contracts
          2. Has empty/stub implementations
          3. Throws 'NotImplemented' errors
          4. Allows tests to run and fail properly

          Based on: 09_architect_api.md

          This skeleton ensures tests fail with proper errors,
          not with "Cannot find module" or "undefined function"
        outputs:
          - src/{{featureId}}/index.js # Main entry point
          - src/{{featureId}}/types.js # Types/interfaces if needed
          - 10b_architect_skeleton.md # Documentation

    gates:
      - check: file_exists(09_architect_api.md)
      - check: file_exists(10_architect_plan.md)
      - check: file_exists(src/{{featureId}}/index.js) # NEW

    checkpoint:
      when: route.complex
      prompt: 'Review architecture and skeleton before QA phase?'

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 4: QA - Test Definition (RED Phase)
  # ──────────────────────────────────────────────────────────────────────────
  qa:
    agent: qa
    inputs: [pm.outputs, architect.outputs]

    tasks:
      - id: test_strategy
        prompt: |
          Create test plan from acceptance criteria
          Source: 06_pm_acceptance.md
        output: 11_qa_test_plan.md

      - id: quality_gates
        prompt: |
          Define quality thresholds and metrics
        output: 12_qa_quality_gates.md

      - id: write_tests
        prompt: |
          Write FAILING tests (RED phase)
          Must test: {{description}}

          Important: Tests should:
          1. Import from src/{{featureId}}/index.js (skeleton exists)
          2. Call actual functions (they exist but throw NotImplemented)
          3. Assert expected behavior (will fail)
          4. Fail with meaningful errors, not missing imports

          Tests must fail with assertion errors, showing that:
          - Functions exist but don't work yet
          - Expected behavior is not implemented
          - Clear what needs to be built
        outputs:
          - tests/{{featureId}}.test.js
          - 13_qa_test_summary.md

      # NEW: Verify proper RED state
      - id: verify_red_state
        prompt: |
          Run tests and verify they fail PROPERLY:
          - No "module not found" errors
          - No "undefined function" errors  
          - Only assertion failures or NotImplemented errors

          This confirms skeleton and tests are properly connected
        output: 14_qa_red_verification.md

    gates:
      - check: file_exists(tests/{{featureId}}.test.js)
      - check: test_fails(tests/{{featureId}}.test.js) # Must be RED
      - check: proper_failure_type # NEW: Not import errors

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Routing (Complexity-based path selection)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
routing:
  # Orchestrator determines route based on signals
  detection:
    simple:
      signals: ['ui', 'config', 'text change', 'minor']
      word_count: ['< 50', 'quick', 'simple']

    complex:
      signals: ['auth', 'payment', 'security', 'integration']
      word_count: ['> 200', 'comprehensive', 'detailed']

    standard:
      default: true # When no clear signals

  # Route configurations
  routes:
    simple:
      skip_tasks:
        - analyst.impact_assessment
        - architect.system_design
      time_estimate: '5-7 minutes'

    standard:
      skip_tasks: []
      time_estimate: '10-15 minutes'

    complex:
      skip_tasks: []
      add_checkpoint: architect.after
      time_estimate: '15-20 minutes'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Validation Gates (Simple pass/fail checks)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
gates:
  # Gate types available to orchestrator
  types:
    file_exists:
      check: 'path.exists()'

    contains:
      check: 'file.includes(text)'

    test_fails:
      check: 'exit_code != 0'

    proper_failure_type: # NEW
      check: "error_type in ['AssertionError', 'NotImplementedError']"
      not: "error_type in ['ModuleNotFoundError', 'ReferenceError']"

    word_count:
      check: 'count >= min && count <= max'

  # Recovery hints for orchestrator
  recovery:
    file_missing: 'retry_task'
    content_missing: 'append_missing_section'
    test_passing: 'ensure_no_implementation'
    import_error: 'create_skeleton_first' # NEW

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Skeleton Code Templates (NEW SECTION)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
skeleton:
  javascript:
    template: |
      // Auto-generated skeleton for {{featureId}}
      // This file provides the structure for tests to run and fail properly

      class NotImplementedError extends Error {
        constructor(method) {
          super(`Method '${method}' is not implemented yet`);
          this.name = 'NotImplementedError';
        }
      }

      {{#each functions}}
      /**
       * {{description}}
       * @param {{params}}
       * @returns {{returnType}}
       */
      function {{name}}({{params}}) {
        throw new NotImplementedError('{{name}}');
      }
      {{/each}}

      {{#each classes}}
      class {{name}} {
        {{#each methods}}
        {{name}}({{params}}) {
          throw new NotImplementedError('{{../name}}.{{name}}');
        }
        {{/each}}
      }
      {{/each}}

      module.exports = {
        {{exports}}
      };

  typescript:
    template: |
      // Similar but with TypeScript interfaces

  python:
    template: |
      # Similar but with Python syntax

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Output Structure (Where files go)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
outputs:
  directory: '.ai/features/{{featureId}}/'

  structure:
    analyst:
      - 01_problem.md
      - 02_success.md
      - 03_impact.md # optional
      - 04_analyst_report.md

    pm:
      - 05_pm_goals.md
      - 06_pm_acceptance.md
      # - 07_pm_report.md

    architect:
      - 08_architect_design.md # optional
      - 09_architect_api.md
      - 10_architect_plan.md
      - 10b_architect_skeleton.md # NEW

    qa:
      - 11_qa_test_plan.md
      - 12_qa_quality_gates.md
      - 13_qa_test_summary.md
      - 14_qa_red_verification.md # NEW

    code: # NEW section
      - src/{{featureId}}/index.js # Skeleton implementation
      - src/{{featureId}}/types.js # Type definitions if needed
      - tests/{{featureId}}.test.js # Failing tests

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Orchestrator Instructions (How to execute this workflow)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
orchestration:
  execution_flow:
    1: 'Analyze context → Determine route'
    2: 'For each phase in sequence:'
    3: '  - Prepare context from previous outputs'
    4: '  - Call agent with task + context'
    5: '  - Validate gates'
    6: '  - Handle failures if needed'
    7: 'Create skeleton code (architect phase)' # NEW
    8: 'Write tests against skeleton (qa phase)' # UPDATED
    9: 'Verify proper RED state' # NEW
    10: 'Compile final summary'

  error_handling:
    retry_limit: 2
    fallback: 'save_partial_and_escalate'

  state_tracking:
    save: '.ai/workflows/state/{{featureId}}.json'
    includes: [phase_status, outputs, metrics, issues]

  completion_summary:
    template: |
      ✅ TDD Setup Complete: {{featureId}}

      📊 Phases Completed:
      - Analyst: {{analyst.task_count}} tasks ({{analyst.duration}}s)
      - PM: {{pm.task_count}} tasks ({{pm.duration}}s)  
      - Architect: {{architect.task_count}} tasks + skeleton ({{architect.duration}}s)
      - QA: {{qa.task_count}} tasks + tests ({{qa.duration}}s)

      📁 Deliverables: 
      - Documents: {{doc_count}} files
      - Skeleton: src/{{featureId}}/index.js
      - Tests: tests/{{featureId}}.test.js

      🧪 RED Phase Status:
      - Tests: FAILING (as expected) 🔴
      - Skeleton: EXISTS (minimal structure) ✓
      - Imports: WORKING (no module errors) ✓

      ⏱️ Total: {{total_duration}}s

      Next: Run 'tdd-implement' to enter GREEN phase

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Metadata
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
meta:
  version: '3.0.0'
  architecture: 'lean'
  last_updated: '2025-10-31'

  changelog:
    v3.0:
      - 'Added skeleton code generation in architect phase'
      - 'Tests now fail properly (not with import errors)'
      - 'Proper RED state verification'
      - 'Better handoff to GREEN phase'

    v2.9:
      - 'Separated concerns: workflow is just sequence + gates'
      - 'Removed complex logic (orchestrator handles)'
      - 'Simplified to 200 lines (was 400+)'

  compatible_with:
    orchestrator: '>= 1.0'
    agents: 'adaptive-mode-enabled'

  related_workflows:
    - tdd-implement # GREEN phase
    - tdd-refactor # REFACTOR phase
    - quick-poc # Rapid prototyping
