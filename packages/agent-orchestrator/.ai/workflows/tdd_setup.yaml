name: tdd-setup
description: Complete TDD setup from problem analysis to test plan

# Interactive context configuration
context:
  interactive: true
  prompts:
    - key: requirements
      question: "Do you have a requirements document or spec?"
      question_ko: "요구사항 문서나 명세가 있나요?"
      type: file
      required: false
      examples:
        - ".ai/features/{{featureId}}/requirements.md"
        - "docs/specs/{{featureId}}.md"

    - key: existing_code
      question: "Any existing code to reference (services, models, etc.)?"
      question_ko: "참고할 기존 코드가 있나요? (서비스, 모델 등)"
      type: file
      required: false
      examples:
        - "src/services/**/*.ts"
        - "src/models/**/*.ts"

    - key: constraints
      question: "Any technical constraints? (libraries, patterns, etc.)"
      question_ko: "기술적 제약사항이 있나요? (라이브러리, 패턴 등)"
      type: text
      required: false

steps:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 📊 ANALYST Phase: Problem Framing & Analysis
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - persona: analyst
    task: create-problem-statement
    description: "Analyze user request and create structured problem statement"
    bindings:
      inputs:
        user_request: "{{prompt}}"
        requirements: "{{requirements}}"
        existing_code: "{{existing_code}}"
      outputs:
        problem_statement: ".ai/output/feature/{{featureId}}/01_problem.md"

  - persona: analyst
    task: create-success-criteria
    description: "Define measurable success criteria"
    bindings:
      inputs:
        problem_statement: ".ai/output/feature/{{featureId}}/01_problem.md"
      outputs:
        success_criteria: ".ai/output/feature/{{featureId}}/02_success.md"

  - persona: analyst
    task: create-impact-map
    description: "Map impact areas, dependencies, and risks"
    bindings:
      inputs:
        problem_statement: ".ai/output/feature/{{featureId}}/01_problem.md"
        success_criteria: ".ai/output/feature/{{featureId}}/02_success.md"
      outputs:
        impact_map: ".ai/output/feature/{{featureId}}/03_impact.md"

  - persona: analyst
    task: create-analyst-report
    description: "Compile comprehensive analyst report for PM handoff"
    bindings:
      inputs:
        problem_statement: ".ai/output/feature/{{featureId}}/01_problem.md"
        success_criteria: ".ai/output/feature/{{featureId}}/02_success.md"
        impact_map: ".ai/output/feature/{{featureId}}/03_impact.md"
      outputs:
        analyst_report: ".ai/output/feature/{{featureId}}/04_analyst-report.md"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🎯 PM Phase: Product Planning & Acceptance Criteria
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - persona: pm
    task: create-product-goals
    description: "Define product goals and KPIs from analysis"
    bindings:
      inputs:
        analyst_report: ".ai/output/feature/{{featureId}}/04_analyst-report.md"
      outputs:
        product_goals: ".ai/output/feature/{{featureId}}/05_pm-goals.md"

  - persona: pm
    task: create-acceptance-criteria
    description: "Create detailed acceptance criteria with user stories"
    bindings:
      inputs:
        product_goals: ".ai/output/feature/{{featureId}}/05_pm-goals.md"
        analyst_report: ".ai/output/feature/{{featureId}}/04_analyst-report.md"
      outputs:
        acceptance_criteria: ".ai/output/feature/{{featureId}}/07_pm-acceptance-criteria.md"

  - persona: pm
    task: create-pm-summary
    description: "Summarize PM deliverables for Architect & QA handoff"
    bindings:
      inputs:
        product_goals: ".ai/output/feature/{{featureId}}/05_pm-goals.md"
        acceptance_criteria: ".ai/output/feature/{{featureId}}/07_pm-acceptance-criteria.md"
      outputs:
        pm_summary: ".ai/output/feature/{{featureId}}/08_pm-report.md"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🧩 ARCHITECT Phase: Technical Design & Implementation Plan
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - persona: architect
    task: create-implementation-plan
    description: "Create stepwise implementation plan for developers"
    bindings:
      inputs:
        pm_summary: ".ai/output/feature/{{featureId}}/08_pm-report.md"
      outputs:
        implementation_plan: ".ai/output/feature/{{featureId}}/12_architect-plan.md"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🧪 QA Phase: Test Strategy & Test Plan
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - persona: qa
    task: create-test-plan
    description: "Define comprehensive test strategy and test cases"
    bindings:
      inputs:
        acceptance_criteria: ".ai/output/feature/{{featureId}}/07_pm-acceptance-criteria.md"
        implementation_plan: ".ai/output/feature/{{featureId}}/12_architect-plan.md"
      outputs:
        test_plan: ".ai/output/feature/{{featureId}}/13_qa-test-plan.md"
